<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff; color: #262626; max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px;
  }
  svg { display: block; }
  button { font-family: inherit; }

  /* top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; position: sticky; top: 0; background: #fff; z-index: 5; }
  .topbar .name { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 6px; }
  .verified { width: 16px; height: 16px; }

  /* profile header */
  .profile { display: flex; align-items: center; gap: 24px; padding: 58px 16px 12px; }
  .avatar-wrap { position: relative; flex: 0 0 auto; }
  .avatar-ring { padding: 3px; border-radius: 50%; background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); cursor: pointer; }
  .avatar-ring.wig { animation: wig .4s ease; }
  @keyframes wig { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-7deg) scale(1.05); } 75% { transform: rotate(7deg) scale(1.05); } }
  .avatar-ring .inner { background: #fff; padding: 3px; border-radius: 50%; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #ddd; display: block; }
  .stats { display: flex; flex: 1; justify-content: space-around; text-align: center; }
  .stats b { display: block; font-size: 17px; }
  .stats span { font-size: 13px; }

  /* IG note bubble */
  .note { position: absolute; left: -6px; top: -48px; background: #fff; color: #262626; font-size: 11.5px; font-weight: 500; line-height: 1.25; padding: 7px 11px; border-radius: 16px; box-shadow: 0 1px 9px rgba(0,0,0,.25); cursor: pointer; white-space: nowrap; z-index: 2; animation: floaty 3.2s ease-in-out infinite; }
  .note::after { content: ""; position: absolute; left: 20px; bottom: -8px; width: 9px; height: 9px; background: #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .note::before { content: ""; position: absolute; left: 14px; bottom: -14px; width: 5px; height: 5px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .note span { display: inline-block; }
  .note.swap span { animation: noteIn .35s ease; }
  @keyframes noteIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* party hat */
  .hat { position: absolute; top: -22px; right: -4px; width: 44px; height: 50px; pointer-events: none; transform: rotate(16deg) scale(0); transform-origin: 50% 100%; transition: transform .6s cubic-bezier(.3,1.8,.5,1); z-index: 3; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .hat.on { transform: rotate(16deg) scale(1); }
  .hat svg { width: 100%; height: 100%; }

  .bio { padding: 0 16px 12px; font-size: 14px; line-height: 1.4; white-space: pre-line; }
  .bio .full { font-weight: 600; }

  .actions { display: flex; gap: 6px; padding: 0 16px 14px; margin-top: 30px; }
  .btn { flex: 1; border: 0; border-radius: 8px; padding: 8px; font-weight: 600; font-size: 14px; background: #efefef; color: #262626; cursor: pointer; }
  .btn.primary { background: #0095f6; color: #fff; }

  /* highlights */
  .highlights { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 14px; scrollbar-width: none; }
  .highlights::-webkit-scrollbar { display: none; }
  .hl { text-align: center; flex: 0 0 auto; width: 80px; cursor: pointer; position: relative; }
  .hl .circle { width: 62px; height: 62px; border-radius: 50%; border: 1px solid #dbdbdb; padding: 3px; margin: 0 auto 4px; transition: filter .4s, opacity .4s; }
  .hl .circle img, .hl .circle div { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #efefef; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .hl span.lbl { font-size: 12px; display: block; line-height: 1.25; white-space: normal; overflow-wrap: anywhere; }
  .hl .lock { display: none; position: absolute; top: 40px; left: calc(50% + 8px); width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 5px rgba(0,0,0,.3); align-items: center; justify-content: center; font-size: 12px; }
  .hl.locked .lock { display: flex; }
  .hl.locked .circle { filter: grayscale(1); opacity: .55; }
  .hl.locked { animation: none; }
  .hl.shake { animation: shake .45s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .hl.just-unlocked .circle { animation: unlockPop .9s ease; }
  @keyframes unlockPop { 0% { transform: scale(.7); } 40% { transform: scale(1.25) rotate(8deg); } 70% { transform: scale(.95); } 100% { transform: scale(1); } }

  /* tabs */
  .tabs { display: flex; border-top: 1px solid #dbdbdb; }
  .tab { flex: 1; padding: 12px 0; display: flex; justify-content: center; border-top: 1px solid transparent; margin-top: -1px; }
  .tab.active { border-top-color: #262626; }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .cell { position: relative; aspect-ratio: 1/1; background: #efefef; cursor: pointer; overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell:active { opacity: .8; }

  /* post viewer */
  .viewer { position: fixed; inset: 0; background: #fff; z-index: 20; display: none; flex-direction: column; max-width: 480px; margin: 0 auto; overflow-y: auto; }
  .viewer.open { display: flex; }
  .vbar { display: flex; align-items: center; gap: 16px; padding: 12px 16px; position: sticky; top: 0; background: #fff; z-index: 2; }
  .vbar .title { font-weight: 700; font-size: 16px; }
  .back { background: none; border: 0; cursor: pointer; padding: 0; }
  .phead { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
  .phead img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #ddd; }
  .pimg { position: relative; width: 100%; background: #111; min-height: 200px; display: flex; justify-content: center; }
  .imgbox { position: relative; display: flex; max-width: 100%; }
  .pimg img { display: block; width: auto; max-width: 100%; max-height: 56vh; max-height: 56dvh; object-fit: contain; }
  .heart-pop { position: absolute; top: 50%; left: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px; fill: #fff; opacity: 0; transform: scale(.3); pointer-events: none; filter: drop-shadow(0 2px 8px rgba(0,0,0,.4)); }
  .heart-pop.go { animation: pop .8s ease; }
  @keyframes pop { 0% {opacity:0; transform:scale(.3)} 20% {opacity:1; transform:scale(1.15)} 50% {transform:scale(.95)} 80% {opacity:1} 100% {opacity:0; transform:scale(1)} }

  /* hidden hearts */
  .hh { position: absolute; transform: translate(-50%,-50%); width: 38px; height: 38px; background: none; border: 0; font-size: 19px; line-height: 38px; text-align: center; cursor: pointer; opacity: .5; animation: twinkle 2.6s ease-in-out infinite; z-index: 3; filter: drop-shadow(0 0 3px rgba(255,255,255,.6)); }
  @keyframes twinkle { 0%,100% { opacity: .28; transform: translate(-50%,-50%) scale(.9); } 50% { opacity: .75; transform: translate(-50%,-50%) scale(1.1); } }
  .hh.got { animation: gotHeart .6s ease forwards; }
  @keyframes gotHeart { 0% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 40% { opacity: 1; transform: translate(-50%,-80%) scale(2.6); } 100% { opacity: 0; transform: translate(-50%,-180%) scale(3.4); } }

  .icons { display: flex; align-items: center; gap: 16px; padding: 10px 12px 4px; }
  .icons .spacer { flex: 1; }
  .icons button { background: none; border: 0; cursor: pointer; padding: 0; }
  #likeBtn svg { stroke: #262626; fill: none; transition: transform .15s; }
  #likeBtn.liked svg { fill: #ff3040; stroke: #ff3040; }
  #likeBtn:active svg { transform: scale(1.25); }
  .likes { padding: 4px 12px; font-weight: 600; font-size: 14px; }
  .caption { padding: 2px 12px; font-size: 14px; line-height: 1.4; white-space: pre-line; }
  .caption b { font-weight: 700; }
  .comments { padding: 6px 12px; font-size: 14px; line-height: 1.5; }
  .comments div { margin-bottom: 4px; }
  .date { padding: 4px 12px 24px; font-size: 11px; color: #737373; text-transform: uppercase; letter-spacing: .3px; }

  .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: #262626; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 105; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }

  /* story highlights + viewer */
  .hl.story .circle { border: 2px solid transparent; background: linear-gradient(#fff,#fff) padding-box, linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5) border-box; padding: 2px; }
  .story-view { position: fixed; inset: 0; z-index: 50; background: #000; display: none; max-width: 480px; margin: 0 auto; overflow: hidden; }
  .story-view.open { display: block; }
  .story-view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .s-top { position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding: 12px 12px 24px; background: linear-gradient(rgba(0,0,0,.55), transparent); }
  .s-bars { display: flex; gap: 4px; margin-bottom: 10px; }
  .s-bar { flex: 1; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; overflow: hidden; }
  .s-bar i { display: block; height: 100%; width: 0; background: #fff; }
  .s-head { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; font-size: 14px; }
  .s-head img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #555; }
  .s-head .grow { flex: 1; }
  .s-head button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; padding: 4px 6px; }
  .s-tap { position: absolute; top: 70px; bottom: 84px; z-index: 2; }
  .s-tap.l { left: 0; width: 30%; } .s-tap.m { left: 30%; width: 40%; } .s-tap.r { right: 0; width: 30%; }
  .s-msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #fff; font-size: 20px; font-weight: 700; padding: 24px; background: linear-gradient(135deg,#d62976,#962fbf,#4f5bd5); }
  .s-msg.show { display: flex; }
  .s-pause { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 56px; color: #fff; z-index: 3; display: none; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .s-pause.show { display: block; }

  /* story reactions */
  .s-react { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 10px; padding: 0 10px; z-index: 4; }
  .s-react button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.14); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 24px; cursor: pointer; transition: transform .12s; }
  .s-react button:active { transform: scale(1.35); }
  .s-float { position: absolute; bottom: 90px; font-size: 34px; z-index: 4; pointer-events: none; opacity: 0; animation: rise 2.2s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx,0px), -55vh) scale(1.5); } }

  /* "Push me!" hint */
  .follow-wrap { position: relative; flex: 1; display: flex; }
  .follow-wrap .btn { flex: 1; }
  .hint { position: absolute; left: 50%; top: -32px; transform: translateX(-50%); background: #262626; color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 12px; white-space: nowrap; pointer-events: none; animation: bob 1s ease-in-out infinite; }
  .hint::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: #262626; }
  .hint.hide { display: none; }
  @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }
  .btn.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(0,149,246,.5); } 50% { box-shadow: 0 0 0 8px rgba(0,149,246,0); } }

  /* birthday celebration */
  .subs { margin-top: 16px; padding: 0 24px; display: flex; flex-direction: column; gap: 8px; }
  .subs div { font-size: 16px; font-weight: 700; color: #262626; background: rgba(255,255,255,.92); border-radius: 14px; padding: 8px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.12); opacity: 0; animation: subIn .5s ease forwards; }
  @keyframes subIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 120; }
  .bday { position: fixed; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; opacity: 0; }
  .bday.show { animation: bdayIn 5.6s ease forwards; }
  .bday .big { font-size: 46px; font-weight: 800; line-height: 1.1; padding: 0 16px; background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 6px rgba(0,0,0,.15)); }
  .bday .emoji { font-size: 64px; margin-bottom: 8px; animation: wiggle .6s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-12deg) scale(1); } to { transform: rotate(12deg) scale(1.15); } }
  @keyframes bdayIn {
    0%   { opacity: 0; transform: scale(.4); }
    8%   { opacity: 1; transform: scale(1.1); }
    13%  { transform: scale(1); }
    88%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); }
  }

  /* follower counter animation */
  .stats > div { position: relative; }
  .stats b.bump { animation: numPop .7s ease; }
  @keyframes numPop { 0% { transform: scale(1); } 35% { transform: scale(1.6); color: #ff3040; } 100% { transform: scale(1); } }
  .fh { position: absolute; top: 0; left: 50%; font-size: 15px; font-weight: 800; white-space: nowrap; pointer-events: none; opacity: 0; z-index: 6; animation: fh 1.5s ease-out forwards; }
  @keyframes fh {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(.6); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -75px) scale(1.25); }
  }

  /* secret scratch card */
  .cell.secret { background: linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); background-size: 200% 200%; animation: shimmer 4s ease infinite; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; font-weight: 800; font-size: 13px; line-height: 1.25; text-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .cell.secret .sparkle { font-size: 26px; animation: wiggle .8s ease-in-out infinite alternate; }
  .cell.secret small { display: block; font-size: 10px; font-weight: 600; opacity: .95; margin-top: 2px; }
  @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .scratch-view { position: fixed; inset: 0; z-index: 55; background: #fff; display: none; flex-direction: column; max-width: 480px; margin: 0 auto; overflow-y: auto; }
  .scratch-view.open { display: flex; }
  .sc-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px 16px 28px; }
  .sc-card { position: relative; width: min(100%, 360px); aspect-ratio: 4/5; max-height: 68vh; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.18); background: #efefef; }
  .sc-under { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
  .sc-under img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sc-msg { position: relative; z-index: 1; width: 100%; padding: 20px 18px; color: #fff; font-weight: 800; font-size: 22px; line-height: 1.3; white-space: pre-line; text-shadow: 0 2px 8px rgba(0,0,0,.3); opacity: 0; transform: translateY(16px); transition: opacity .8s ease .5s, transform .8s ease .5s; }
  .sc-under.revealed .sc-msg { opacity: 1; transform: none; }
  .sc-under.has-img { justify-content: flex-end; }
  .sc-under.has-img .sc-msg { padding-top: 40px; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  .sc-cover { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .sc-hint { font-size: 14px; color: #737373; text-align: center; }

  /* ---------- cake / candles ---------- */
  .cake-view { position: fixed; inset: 0; z-index: 56; display: none; flex-direction: column; max-width: 480px; margin: 0 auto; background: radial-gradient(circle at 50% 28%, #4a2370, #160a26 70%); color: #fff; overflow-y: auto; }
  .cake-view.open { display: flex; }
  .cake-view .vbar { background: transparent; }
  .ck-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 8px 16px 28px; text-align: center; }
  .ck-title { font-size: 22px; font-weight: 800; min-height: 54px; display: flex; align-items: center; justify-content: center; }
  .cake-svg { width: min(100%, 340px); height: auto; overflow: visible; }
  .ck-btn { flex: none; width: min(100%, 300px); padding: 12px; font-size: 15px; }
  .ck-sub { font-size: 13px; opacity: .8; min-height: 18px; }
  .flame { cursor: pointer; }
  .flame .fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .5s ease-in-out infinite alternate; filter: drop-shadow(0 0 7px #fbbf24); transition: opacity .25s; }
  @keyframes flicker { from { transform: scale(1,1) rotate(-3deg); } to { transform: scale(.9,1.1) rotate(3deg); } }
  .flame.out .fl { opacity: 0; animation: none; }
  .flame .smoke { fill: none; stroke: #cbd5e1; stroke-width: 3; stroke-linecap: round; opacity: 0; }
  .flame.out .smoke { animation: smoke 1.8s ease-out forwards; }
  @keyframes smoke { 0% { opacity: .85; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-34px); } }

  /* ---------- quest: pill, sheet, modal, banner, finale ---------- */
  .dock { position: fixed; left: 0; right: 0; bottom: 16px; max-width: 480px; margin: 0 auto; display: flex; justify-content: flex-end; padding: 0 16px; pointer-events: none; z-index: 8; }
  .pill { pointer-events: auto; border: 0; cursor: pointer; background: #262626; color: #fff; font-weight: 700; font-size: 14px; padding: 11px 16px; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.3); display: flex; align-items: center; gap: 8px; }
  .pill.bump { animation: pillBump .6s ease; }
  .pill.attn { animation: pillAttn 1.6s ease-in-out infinite; }
  .pill.max { background: linear-gradient(45deg,#fa7e1e,#d62976,#962fbf); }
  @keyframes pillBump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes pillAttn { 0%,100% { box-shadow: 0 4px 16px rgba(0,0,0,.3), 0 0 0 0 rgba(214,41,118,.55); } 50% { box-shadow: 0 4px 16px rgba(0,0,0,.3), 0 0 0 10px rgba(214,41,118,0); } }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 80; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; max-height: 86vh; overflow-y: auto; background: #fff; border-radius: 20px 20px 0 0; z-index: 81; padding: 10px 18px 26px; transform: translateY(105%); transition: transform .4s cubic-bezier(.2,.9,.3,1); }
  .sheet.open { transform: none; }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: #dbdbdb; margin: 0 auto 12px; }
  .sh-head { display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 800; margin-bottom: 8px; }
  .sh-head span { font-size: 14px; color: #737373; font-weight: 700; }
  .prog { height: 8px; background: #efefef; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .prog i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg,#feda75,#fa7e1e,#d62976,#962fbf); transition: width .7s cubic-bezier(.3,1.2,.5,1); }

  .mlist { list-style: none; text-align: left; }
  .mi { display: flex; gap: 12px; align-items: flex-start; padding: 11px 2px; border-bottom: 1px solid #f2f2f2; opacity: 0; animation: miIn .5s ease forwards; }
  .mi:last-child { border-bottom: 0; }
  @keyframes miIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  .mi .box { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 8px; border: 2px solid #d4d4d4; display: flex; align-items: center; justify-content: center; transition: background .3s .15s, border-color .3s .15s; margin-top: 1px; }
  .mi .box svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .mi .tick { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .5s .25s ease; }
  .mi.done .box { background: #22c55e; border-color: #22c55e; }
  .mi.done .tick { stroke-dashoffset: 0; }
  .mi.pop .box { animation: boxPop .6s ease; }
  @keyframes boxPop { 0% { transform: scale(1); } 40% { transform: scale(1.4) rotate(-8deg); } 100% { transform: scale(1); } }
  .mi .ic { font-size: 20px; line-height: 26px; }
  .mi .tx { flex: 1; }

/* ---------- confetti (one shared loop, many bursts allowed) ---------- */
const cv = $("confetti"), cctx = cv.getContext("2d");
let confW = 0, confH = 0, pieces = [], confRunning = false;
function sizeConfetti() {
  const dpr = window.devicePixelRatio || 1;
  confW = innerWidth; confH = innerHeight;
  cv.width = confW * dpr; cv.height = confH * dpr;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeConfetti(); addEventListener("resize", sizeConfetti);
function confettiBurst(count) {
  count = count || 160;
  const colors = ["#feda75","#fa7e1e","#d62976","#962fbf","#4f5bd5","#0095f6","#ffffff","#ff3040"];
  const born = performance.now();
  for (let k = 0; k < count; k++) {
    const fromLeft = k % 2 === 0;
    pieces.push({
      x: fromLeft ? 0 : confW, y: confH * 0.65,
      vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 9),
      vy: -(8 + Math.random() * 12),
      size: 6 + Math.random() * 7,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
      color: colors[Math.floor(Math.random() * colors.length)],
      round: Math.random() < .3, born
    });
  }
  if (!confRunning) { confRunning = true; requestAnimationFrame(confTick); }
}
function confTick(t) {
  cctx.clearRect(0, 0, confW, confH);
  pieces = pieces.filter(p => t - p.born < 5400);
  pieces.forEach(p => {
    p.vy += 0.28; p.vx *= 0.99;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cctx.save();
    cctx.globalAlpha = Math.min(1, Math.max(0, 1 - (t - p.born) / 5400));
    cctx.translate(p.x, p.y); cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    if (p.round) { cctx.beginPath(); cctx.arc(0, 0, p.size / 2, 0, 6.28); cctx.fill(); }
    else cctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    cctx.restore();
  });
  if (pieces.length) requestAnimationFrame(confTick);
  else { confRunning = false; cctx.clearRect(0, 0, confW, confH); }
}

      s.className = "s-float"; s.textContent = emo;
      s.style.left = (12 + Math.random() * 72) + "%";
      s.style.animationDelay = (k * 0.09) + "s";
      s.style.setProperty("--dx", ((Math.random() - .5) * 90) + "px");
      $("story").appendChild(s);
      setTimeout(() => s.remove(), 2600);
    }
  };
  $("sReact").appendChild(b);
});

/* ---------- follower counter ---------- */
const baseFollowers = parseInt(String(CONFIG.followers).replace(/\D/g, ""), 10) || 0;
function bumpFollowers(up) {
  const el = $("sFollowers");
  el.textContent = (baseFollowers + (up ? 1 : 0)).toLocaleString("en-US");
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  if (up) floatHearts(el.parentElement);
}
function floatHearts(host) {
  const em = ["❤️", "💖", "💗", "💕", "💛", "🧡"];
  for (let k = 0; k < 8; k++) {
    const s = document.createElement("span");
    s.className = "fh";
    s.textContent = k === 0 ? "+1 ❤️" : em[k % em.length];
    s.style.left = (k === 0 ? 50 : 15 + Math.random() * 70) + "%";
    s.style.animationDelay = (k * 0.09) + "s";
    s.style.setProperty("--dx", ((Math.random() - .5) * 50) + "px");
    host.appendChild(s);
    setTimeout(() => s.remove(), 2300);
  }
}

/* =========================================================
   SECRET SCRATCH CARD
   ========================================================= */
const sc = { drawing: false, done: false, last: null, lastCheck: 0 };
const scv = $("scCanvas"), sctx = scv.getContext("2d", { willReadFrequently: true });

if (CONFIG.secret) {
  $("scTitle").textContent = CONFIG.secret.title || "Secret post";
  $("scMsg").textContent = CONFIG.secret.message || "";
  if (CONFIG.secret.img) {
    const im = document.createElement("img");
    im.src = CONFIG.secret.img; im.alt = "";
    im.onerror = () => im.remove();
    $("scUnder").prepend(im);
    $("scUnder").classList.add("has-img");
  }
}

function paintCover() {
  const r = scv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  scv.width = Math.round(r.width * dpr); scv.height = Math.round(r.height * dpr);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.globalCompositeOperation = "source-over";
  const g = sctx.createLinearGradient(0, 0, r.width, r.height);
  g.addColorStop(0, "#c9c9d6"); g.addColorStop(.3, "#f4f4fb"); g.addColorStop(.55, "#b9b3d6"); g.addColorStop(.8, "#f7e6f2"); g.addColorStop(1, "#c3c9e6");
  sctx.fillStyle = g; sctx.fillRect(0, 0, r.width, r.height);
  for (let k = 0; k < 320; k++) {
    sctx.fillStyle = `rgba(255,255,255,${.3 + Math.random() * .6})`;
    const z = 1 + Math.random() * 2.5;
    sctx.fillRect(Math.random() * r.width, Math.random() * r.height, z, z);
  }
  sctx.fillStyle = "#7a6fa0"; sctx.textAlign = "center";
  sctx.font = "800 24px -apple-system, Segoe UI, Roboto, sans-serif";
  sctx.fillText("✨ SCRATCH ME ✨", r.width / 2, r.height / 2);
  sctx.font = "600 14px -apple-system, Segoe UI, Roboto, sans-serif";
  sctx.fillText("a little surprise inside", r.width / 2, r.height / 2 + 28);
  scv.style.transition = "none"; scv.style.opacity = 1; scv.style.pointerEvents = "auto";
}

function openScratch() {
  $("scratch").classList.add("open");
  history.pushState({ scratch: true }, "");
  if (!sc.done) requestAnimationFrame(paintCover);
}
function closeScratch() { $("scratch").classList.remove("open"); }
$("scBack").onclick = () => history.back();

function scratchAt(x, y) {
  const r = scv.getBoundingClientRect();
  sctx.globalCompositeOperation = "destination-out";
  sctx.beginPath(); sctx.arc(x - r.left, y - r.top, 26, 0, 6.2832); sctx.fill();
}
function checkScratch() {
  if (sc.done) return;
  const w = scv.width, h = scv.height;
  const d = sctx.getImageData(0, 0, w, h).data;
  let clear = 0, total = 0;
  for (let y = 0; y < h; y += 12) for (let x = 0; x < w; x += 12) { total++; if (d[(y * w + x) * 4 + 3] < 40) clear++; }
  if (clear / total > 0.5) revealScratch();
}
function revealScratch() {
  sc.done = true;
  $("scUnder").classList.add("revealed");
  scv.style.transition = "opacity .7s ease"; scv.style.opacity = 0; scv.style.pointerEvents = "none";
  $("scHint").textContent = "You found it! 🎉";
  confettiBurst();
  complete("secret");
}
scv.addEventListener("pointerdown", e => {
  sc.drawing = true; sc.last = [e.clientX, e.clientY];
  scv.setPointerCapture(e.pointerId); scratchAt(e.clientX, e.clientY); e.preventDefault();
});
scv.addEventListener("pointermove", e => {
  if (!sc.drawing) return;
  const [lx, ly] = sc.last, dx = e.clientX - lx, dy = e.clientY - ly, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 10));
  for (let i = 1; i <= n; i++) scratchAt(lx + dx * i / n, ly + dy * i / n);
  sc.last = [e.clientX, e.clientY];
  const now = performance.now();
  if (now - sc.lastCheck > 350) { sc.lastCheck = now; checkScratch(); }
});
const endScratch = () => { if (!sc.drawing) return; sc.drawing = false; checkScratch(); };
scv.addEventListener("pointerup", endScratch);
scv.addEventListener("pointercancel", endScratch);

/* =========================================================
   CAKE + CANDLES  (blow into the mic, or tap the flames)
   ========================================================= */
const CX = [90, 120, 150, 180, 210];
const CC = ["#60a5fa", "#f472b6", "#fbbf24", "#34d399", "#a78bfa"];
$("candles").innerHTML = CX.map((x, i) =>
  `<g><rect x="${x - 4}" y="84" width="8" height="40" rx="2" fill="${CC[i]}"/>` +
  `<rect x="${x - 4}" y="94" width="8" height="5" fill="#fff" opacity=".55"/><rect x="${x - 4}" y="108" width="8" height="5" fill="#fff" opacity=".55"/>` +
  `<g class="flame" data-i="${i}" transform="translate(${x},80)">` +
  `<g class="fl"><path d="M0 -26 C 9 -12, 9 0, 0 4 C -9 0, -9 -12, 0 -26Z" fill="#fbbf24"/><path d="M0 -14 C 4 -8, 4 -2, 0 2 C -4 -2, -4 -8, 0 -14Z" fill="#fb923c"/></g>` +
  `<path class="smoke" d="M0 -6 C 7 -16, -7 -24, 0 -36"/>` +
  `<circle r="22" cy="-10" fill="rgba(0,0,0,0.001)"/></g></g>`
).join("");

const cake = { out: 0, done: false, ac: null, stream: null, raf: 0, blow: 0, songGain: null };
function getAC() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error("no audio");
  if (!cake.ac) cake.ac = new AC();
  if (cake.ac.state === "suspended") cake.ac.resume();
  return cake.ac;
}
function resetCandles() {
  document.querySelectorAll(".flame").forEach(f => f.classList.remove("out"));
  cake.out = 0; cake.done = false; cake.blow = 0;
  $("ckTitle").textContent = "Make a wish… then blow them out! 🌠";
  $("ckSub").textContent = "No mic? No problem — just tap the flames 👆";
  $("ckMic").textContent = "🎤 Blow into your phone";
}
function openCake() {
  try { getAC(); } catch (e) {}
  resetCandles();
  $("cake").classList.add("open");
  history.pushState({ cake: true }, "");
}
function closeCake() {
  if (!$("cake").classList.contains("open")) return;
  stopMic(); stopSong();
  $("cake").classList.remove("open");
}
$("ckBack").onclick = () => history.back();

function snuffNext() {
  const f = document.querySelector(".flame:not(.out)");
  if (f) snuff(f);
}
function snuff(f) {
  if (f.classList.contains("out")) return;
  f.classList.add("out"); cake.out++;
  if (cake.out >= CX.length) cakeDone();
}
document.querySelectorAll(".flame").forEach(f => f.addEventListener("click", () => snuff(f)));

function cakeDone() {
  if (cake.done) return;
  cake.done = true;
  stopMic();
  $("ckTitle").textContent = "Happy Birthday, Celica! 🎉";
  $("ckSub").textContent = "Did you make a wish? 🌠";
  $("ckMic").textContent = "🔥 Light them again";
  confettiBurst(220);
  playSong();
  complete("candle");
}

async function startMic() {
  if (cake.stream) return;
  try {
    const ac = getAC();
    cake.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const src = ac.createMediaStreamSource(cake.stream);
    const an = ac.createAnalyser(); an.fftSize = 512;
    src.connect(an);
    cake.src = src;
    const buf = new Uint8Array(an.fftSize);
    let last = performance.now();
    $("ckSub").textContent = "Listening… take a deep breath and blow! 💨";
    $("ckMic").textContent = "🎤 Listening…";
    const loop = now => {
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      an.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      if (rms > 0.12) cake.blow += dt; else cake.blow = Math.max(0, cake.blow - dt * 2);
      const target = Math.min(CX.length, Math.floor(cake.blow / 0.22));
      while (cake.out < target && !cake.done) snuffNext();
      cake.raf = requestAnimationFrame(loop);
    };
    cake.raf = requestAnimationFrame(loop);
  } catch (e) {
    cake.stream = null;
    $("ckMic").textContent = "🎤 Try the mic again";
    $("ckSub").textContent = "Mic is blocked — no worries, tap the flames instead 👆";
  }
}
function stopMic() {
  cancelAnimationFrame(cake.raf);
  if (cake.stream) { cake.stream.getTracks().forEach(t => t.stop()); cake.stream = null; }
  if (cake.src) { try { cake.src.disconnect(); } catch (e) {} cake.src = null; }
}
$("ckMic").onclick = () => {
  if (cake.done) { stopSong(); resetCandles(); return; }
  startMic();
};

// "Happy Birthday" on a soft synth
function playSong() {
  try {
    const ac = getAC(); stopSong();
    const g = ac.createGain(); g.gain.value = 0.22; g.connect(ac.destination); cake.songGain = g;
    const N = [
      [392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
      [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
      [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],
      [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]
    ];
    let t = ac.currentTime + 0.15; const beat = 0.42;
    N.forEach(([f, d]) => {
      const o = ac.createOscillator(), e = ac.createGain();
      o.type = "triangle"; o.frequency.value = f;
      o.connect(e); e.connect(g);
      e.gain.setValueAtTime(0.0001, t);
      e.gain.linearRampToValueAtTime(1, t + 0.03);
      e.gain.exponentialRampToValueAtTime(0.001, t + d * beat * 0.95);
      o.start(t); o.stop(t + d * beat);
      t += d * beat;
    });
  } catch (e) {}
}
function stopSong() {
  if (cake.songGain) { try { cake.songGain.disconnect(); } catch (e) {} cake.songGain = null; }
}

/* =========================================================
   START
   ========================================================= */
if (S.hat) $("hat").classList.add("on");
if (S.done.secret) {
  sc.done = true;
  $("scUnder").classList.add("revealed");
  scv.style.opacity = 0; scv.style.pointerEvents = "none";
  $("scHint").textContent = "You found it! 🎉";
}
renderQuest();
showNote(true); startNotes();
if (!S.intro) setTimeout(showIntro, 700);
else if (!allDone()) $("qPill").classList.add("attn");
</script>
