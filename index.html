<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff; color: #262626; max-width: 480px; margin: 0 auto; min-height: 100vh;
  }
  svg { display: block; }

  /* top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; position: sticky; top: 0; background: #fff; z-index: 5; }
  .topbar .name { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 6px; }
  .verified { width: 16px; height: 16px; }

  /* profile header */
  .profile { display: flex; align-items: center; gap: 24px; padding: 8px 16px 12px; }
  .avatar-ring { padding: 3px; border-radius: 50%; background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
  .avatar-ring .inner { background: #fff; padding: 3px; border-radius: 50%; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #ddd; display: block; }
  .stats { display: flex; flex: 1; justify-content: space-around; text-align: center; }
  .stats b { display: block; font-size: 17px; }
  .stats span { font-size: 13px; }

  .bio { padding: 0 16px 12px; font-size: 14px; line-height: 1.4; white-space: pre-line; }
  .bio .full { font-weight: 600; }

  .actions { display: flex; gap: 6px; padding: 0 16px 14px; }
  .btn { flex: 1; border: 0; border-radius: 8px; padding: 8px; font-weight: 600; font-size: 14px; background: #efefef; color: #262626; cursor: pointer; }
  .btn.primary { background: #0095f6; color: #fff; }

  /* highlights */
  .highlights { display: flex; gap: 16px; overflow-x: auto; padding: 0 16px 14px; scrollbar-width: none; }
  .highlights::-webkit-scrollbar { display: none; }
  .hl { text-align: center; flex: 0 0 auto; width: 64px; cursor: pointer; }
  .hl .circle { width: 62px; height: 62px; border-radius: 50%; border: 1px solid #dbdbdb; padding: 3px; margin-bottom: 4px; }
  .hl .circle img, .hl .circle div { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #efefef; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .hl span { font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* tabs */
  .tabs { display: flex; border-top: 1px solid #dbdbdb; }
  .tab { flex: 1; padding: 12px 0; display: flex; justify-content: center; border-top: 1px solid transparent; margin-top: -1px; }
  .tab.active { border-top-color: #262626; }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .cell { position: relative; aspect-ratio: 1/1; background: #efefef; cursor: pointer; overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell:active { opacity: .8; }

  /* post viewer */
  .viewer { position: fixed; inset: 0; background: #fff; z-index: 20; display: none; flex-direction: column; max-width: 480px; margin: 0 auto; overflow-y: auto; }
  .viewer.open { display: flex; }
  .vbar { display: flex; align-items: center; gap: 16px; padding: 12px 16px; position: sticky; top: 0; background: #fff; z-index: 2; }
  .vbar .title { font-weight: 700; font-size: 16px; }
  .back { background: none; border: 0; cursor: pointer; padding: 0; }
  .phead { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
  .phead img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #ddd; }
  .pimg { position: relative; width: 100%; background: #efefef; min-height: 200px; }
  .pimg img { width: 100%; display: block; }
  .heart-pop { position: absolute; top: 50%; left: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px; fill: #fff; opacity: 0; transform: scale(.3); pointer-events: none; filter: drop-shadow(0 2px 8px rgba(0,0,0,.4)); }
  .heart-pop.go { animation: pop .8s ease; }
  @keyframes pop { 0% {opacity:0; transform:scale(.3)} 20% {opacity:1; transform:scale(1.15)} 50% {transform:scale(.95)} 80% {opacity:1} 100% {opacity:0; transform:scale(1)} }
  .icons { display: flex; align-items: center; gap: 16px; padding: 10px 12px 4px; }
  .icons .spacer { flex: 1; }
  .icons button { background: none; border: 0; cursor: pointer; padding: 0; }
  #likeBtn svg { stroke: #262626; fill: none; transition: transform .15s; }
  #likeBtn.liked svg { fill: #ff3040; stroke: #ff3040; }
  #likeBtn:active svg { transform: scale(1.25); }
  .likes { padding: 4px 12px; font-weight: 600; font-size: 14px; }
  .caption { padding: 2px 12px; font-size: 14px; line-height: 1.4; white-space: pre-line; }
  .caption b { font-weight: 700; }
  .comments { padding: 6px 12px; font-size: 14px; line-height: 1.5; }
  .comments div { margin-bottom: 4px; }
  .date { padding: 4px 12px 24px; font-size: 11px; color: #737373; text-transform: uppercase; letter-spacing: .3px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #262626; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 30; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="name"><span id="uname"></span>
    <svg class="verified" viewBox="0 0 24 24"><path fill="#0095f6" d="M12 1l2.6 2.1 3.3-.2 1.1 3.1 2.8 1.8-.9 3.2.9 3.2-2.8 1.8-1.1 3.1-3.3-.2L12 23l-2.6-2.1-3.3.2-1.1-3.1-2.8-1.8.9-3.2-.9-3.2 2.8-1.8 1.1-3.1 3.3.2z"/><path fill="none" stroke="#fff" stroke-width="2.2" d="M7.5 12.5l3 3 6-6.5"/></svg>
  </div>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
</div>

<div class="profile">
  <div class="avatar-ring"><div class="inner"><img id="avatar" class="avatar" alt=""></div></div>
  <div class="stats">
    <div><b id="sPosts"></b><span>posts</span></div>
    <div><b id="sFollowers"></b><span>followers</span></div>
    <div><b id="sFollowing"></b><span>following</span></div>
  </div>
</div>

<div class="bio"><div class="full" id="fullname"></div><div id="bio"></div></div>

<div class="actions">
  <button class="btn primary" id="followBtn">Follow</button>
  <button class="btn" id="msgBtn">Message</button>
</div>

<div class="highlights" id="highlights"></div>

<div class="tabs">
  <div class="tab active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></div>
  <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 3l3 6M15 3l3 6"/><path d="M10 13l5 3-5 3z"/></svg></div>
  <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg></div>
</div>

<div class="grid" id="grid"></div>

<!-- post viewer -->
<div class="viewer" id="viewer">
  <div class="vbar">
    <button class="back" id="backBtn" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title">Posts</div>
  </div>
  <div class="phead"><img id="vAvatar" alt=""><span id="vUser"></span></div>
  <div class="pimg" id="vImgWrap">
    <img id="vImg" alt="">
    <svg class="heart-pop" id="heartPop" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.8-8 11-8 11z"/></svg>
  </div>
  <div class="icons">
    <button id="likeBtn" aria-label="Like"><svg width="26" height="26" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.8-8 11-8 11z"/></svg></button>
    <button aria-label="Comment"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 01-12.2 7.6L3 21l1.5-5.2A8.5 8.5 0 1121 12z"/></svg></button>
    <button aria-label="Share"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2" stroke-linejoin="round"><path d="M22 3L9.5 13.5M22 3l-7 18-5.5-7.5L2 9z"/></svg></button>
    <span class="spacer"></span>
    <button aria-label="Save"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-5-6 5z"/></svg></button>
  </div>
  <div class="likes" id="vLikes"></div>
  <div class="caption"><b id="vUser2"></b> <span id="vCaption"></span></div>
  <div class="comments" id="vComments"></div>
  <div class="date" id="vDate"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   EDIT THIS PART ONLY — everything personal lives here
   ========================================================= */
const CONFIG = {
  username: "happy.birthday.name",     // shown at the top
  fullname: "Friend's Full Name",       // bold name under the stats
  bio: "🎂 Another year, another adventure\n📍 Jakarta\n✨ Made with love, just for you",
  avatar: "images/avatar.jpg",          // profile picture
  followers: "1,234",
  following: "567",

  // Round story-style circles under the buttons (optional, can be empty: [])
  highlights: [
    { label: "Memories", emoji: "📸", img: "" },
    { label: "Trips",    emoji: "✈️", img: "" },
    { label: "Food",     emoji: "🍜", img: "" },
    { label: "Fun",      emoji: "🎉", img: "" }
  ],

  // One entry per photo. Add / remove blocks freely.
  posts: [
    {
      img: "images/photo1.jpg",
      caption: "Where it all began 💛",
      date: "January 12, 2024",
      likes: 128,
      comments: [
        { user: "me", text: "Best day ever! 😂" },
        { user: "bestie", text: "Remember this?? 🥹" }
      ]
    },
    {
      img: "images/photo2.jpg",
      caption: "That trip we'll never forget ✈️",
      date: "June 3, 2024",
      likes: 256,
      comments: [{ user: "me", text: "Take me back 😭" }]
    },
    {
      img: "images/photo3.jpg",
      caption: "Happy Birthday!! 🎂🎈",
      date: "October 31, 2026",
      likes: 999,
      comments: [{ user: "me", text: "Love you, forever friends 💖" }]
    }
  ]
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const FALLBACKS = ["#feda75","#fa7e1e","#d62976","#962fbf","#4f5bd5","#0095f6"];

function fallback(img, i) {
  img.onerror = () => {
    img.removeAttribute("src");
    img.style.background = `linear-gradient(135deg, ${FALLBACKS[i % 6]}, ${FALLBACKS[(i + 2) % 6]})`;
    img.style.minHeight = "200px";
  };
}

// header
$("uname").textContent = CONFIG.username;
$("fullname").textContent = CONFIG.fullname;
$("bio").textContent = CONFIG.bio;
$("avatar").src = CONFIG.avatar; fallback($("avatar"), 0);
$("sPosts").textContent = CONFIG.posts.length;
$("sFollowers").textContent = CONFIG.followers;
$("sFollowing").textContent = CONFIG.following;
document.title = CONFIG.username;

// follow button
let following = false;
$("followBtn").onclick = () => {
  following = !following;
  $("followBtn").textContent = following ? "Following" : "Follow";
  $("followBtn").classList.toggle("primary", !following);
};
$("msgBtn").onclick = () => toast("Happy Birthday! 🎉");

// highlights
CONFIG.highlights.forEach(h => {
  const el = document.createElement("div");
  el.className = "hl";
  el.innerHTML = `<div class="circle">${h.img ? `<img src="${h.img}" alt="">` : `<div>${h.emoji || "⭐"}</div>`}</div><span>${h.label}</span>`;
  el.onclick = () => toast(h.label);
  $("highlights").appendChild(el);
});

// grid
CONFIG.posts.forEach((p, i) => {
  const cell = document.createElement("div");
  cell.className = "cell";
  const img = document.createElement("img");
  img.src = p.img; img.alt = p.caption || ""; img.loading = "lazy";
  fallback(img, i);
  cell.appendChild(img);
  cell.onclick = () => openPost(i);
  $("grid").appendChild(cell);
});

// viewer
let current = 0, liked = {};
function openPost(i) {
  current = i;
  const p = CONFIG.posts[i];
  $("vAvatar").src = CONFIG.avatar; fallback($("vAvatar"), 0);
  $("vUser").textContent = CONFIG.username;
  $("vUser2").textContent = CONFIG.username;
  $("vImg").removeAttribute("style");
  $("vImg").src = p.img; fallback($("vImg"), i);
  $("vCaption").textContent = p.caption || "";
  $("vDate").textContent = p.date || "";
  $("vComments").innerHTML = (p.comments || []).map(c => `<div><b>${c.user}</b> ${c.text}</div>`).join("");
  renderLikes();
  $("viewer").classList.add("open");
  $("viewer").scrollTop = 0;
  history.pushState({ post: i }, "");
}
function renderLikes() {
  const p = CONFIG.posts[current];
  const n = (p.likes || 0) + (liked[current] ? 1 : 0);
  $("vLikes").textContent = n.toLocaleString() + " likes";
  $("likeBtn").classList.toggle("liked", !!liked[current]);
}
function closePost() { $("viewer").classList.remove("open"); }
$("backBtn").onclick = () => history.back();
window.addEventListener("popstate", closePost);

$("likeBtn").onclick = () => { liked[current] = !liked[current]; renderLikes(); };
// double-tap to like
let lastTap = 0;
$("vImgWrap").addEventListener("click", () => {
  const now = Date.now();
  if (now - lastTap < 300) {
    liked[current] = true; renderLikes();
    const h = $("heartPop"); h.classList.remove("go"); void h.offsetWidth; h.classList.add("go");
  }
  lastTap = now;
});

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600);
}
</script>
</body>
</html>
