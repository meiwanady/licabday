<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff; color: #262626; max-width: 480px; margin: 0 auto; min-height: 100vh;
  }
  svg { display: block; }

  /* top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; position: sticky; top: 0; background: #fff; z-index: 5; }
  .topbar .name { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 6px; }
  .verified { width: 16px; height: 16px; }

  /* profile header */
  .profile { display: flex; align-items: center; gap: 24px; padding: 8px 16px 12px; }
  .avatar-ring { padding: 3px; border-radius: 50%; background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
  .avatar-ring .inner { background: #fff; padding: 3px; border-radius: 50%; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #ddd; display: block; }
  .stats { display: flex; flex: 1; justify-content: space-around; text-align: center; }
  .stats b { display: block; font-size: 17px; }
  .stats span { font-size: 13px; }

  .bio { padding: 0 16px 12px; font-size: 14px; line-height: 1.4; white-space: pre-line; }
  .bio .full { font-weight: 600; }

  .actions { display: flex; gap: 6px; padding: 0 16px 14px; }
  .btn { flex: 1; border: 0; border-radius: 8px; padding: 8px; font-weight: 600; font-size: 14px; background: #efefef; color: #262626; cursor: pointer; }
  .btn.primary { background: #0095f6; color: #fff; }

  /* highlights */
  .highlights { display: flex; gap: 16px; overflow-x: auto; padding: 0 16px 14px; scrollbar-width: none; }
  .highlights::-webkit-scrollbar { display: none; }
  .hl { text-align: center; flex: 0 0 auto; width: 64px; cursor: pointer; }
  .hl .circle { width: 62px; height: 62px; border-radius: 50%; border: 1px solid #dbdbdb; padding: 3px; margin-bottom: 4px; }
  .hl .circle img, .hl .circle div { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #efefef; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .hl span { font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* tabs */
  .tabs { display: flex; border-top: 1px solid #dbdbdb; }
  .tab { flex: 1; padding: 12px 0; display: flex; justify-content: center; border-top: 1px solid transparent; margin-top: -1px; }
  .tab.active { border-top-color: #262626; }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .cell { position: relative; aspect-ratio: 1/1; background: #efefef; cursor: pointer; overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell:active { opacity: .8; }

  /* post viewer */
  .viewer { position: fixed; inset: 0; background: #fff; z-index: 20; display: none; flex-direction: column; max-width: 480px; margin: 0 auto; overflow-y: auto; }
  .viewer.open { display: flex; }
  .vbar { display: flex; align-items: center; gap: 16px; padding: 12px 16px; position: sticky; top: 0; background: #fff; z-index: 2; }
  .vbar .title { font-weight: 700; font-size: 16px; }
  .back { background: none; border: 0; cursor: pointer; padding: 0; }
  .phead { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
  .phead img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #ddd; }
  .pimg { position: relative; width: 100%; background: #111; min-height: 200px; display: flex; justify-content: center; }
  .pimg img { display: block; width: auto; max-width: 100%; max-height: 56vh; max-height: 56dvh; object-fit: contain; }
  .heart-pop { position: absolute; top: 50%; left: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px; fill: #fff; opacity: 0; transform: scale(.3); pointer-events: none; filter: drop-shadow(0 2px 8px rgba(0,0,0,.4)); }
  .heart-pop.go { animation: pop .8s ease; }
  @keyframes pop { 0% {opacity:0; transform:scale(.3)} 20% {opacity:1; transform:scale(1.15)} 50% {transform:scale(.95)} 80% {opacity:1} 100% {opacity:0; transform:scale(1)} }
  .icons { display: flex; align-items: center; gap: 16px; padding: 10px 12px 4px; }
  .icons .spacer { flex: 1; }
  .icons button { background: none; border: 0; cursor: pointer; padding: 0; }
  #likeBtn svg { stroke: #262626; fill: none; transition: transform .15s; }
  #likeBtn.liked svg { fill: #ff3040; stroke: #ff3040; }
  #likeBtn:active svg { transform: scale(1.25); }
  .likes { padding: 4px 12px; font-weight: 600; font-size: 14px; }
  .caption { padding: 2px 12px; font-size: 14px; line-height: 1.4; white-space: pre-line; }
  .caption b { font-weight: 700; }
  .comments { padding: 6px 12px; font-size: 14px; line-height: 1.5; }
  .comments div { margin-bottom: 4px; }
  .date { padding: 4px 12px 24px; font-size: 11px; color: #737373; text-transform: uppercase; letter-spacing: .3px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #262626; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 30; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* story highlights + viewer */
  .hl.story .circle { border: 2px solid transparent; background: linear-gradient(#fff,#fff) padding-box, linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5) border-box; padding: 2px; }
  .story-view { position: fixed; inset: 0; z-index: 50; background: #000; display: none; max-width: 480px; margin: 0 auto; }
  .story-view.open { display: block; }
  .story-view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .s-top { position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding: 12px 12px 24px; background: linear-gradient(rgba(0,0,0,.55), transparent); }
  .s-bars { display: flex; gap: 4px; margin-bottom: 10px; }
  .s-bar { flex: 1; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; overflow: hidden; }
  .s-bar i { display: block; height: 100%; width: 0; background: #fff; }
  .s-head { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; font-size: 14px; }
  .s-head img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #555; }
  .s-head .grow { flex: 1; }
  .s-head button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; padding: 4px 6px; }
  .s-tap { position: absolute; top: 70px; bottom: 0; z-index: 2; }
  .s-tap.l { left: 0; width: 30%; } .s-tap.m { left: 30%; width: 40%; } .s-tap.r { right: 0; width: 30%; }
  .s-msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #fff; font-size: 20px; font-weight: 700; padding: 24px; background: linear-gradient(135deg,#d62976,#962fbf,#4f5bd5); }
  .s-msg.show { display: flex; }
  .s-pause { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 56px; color: #fff; z-index: 3; display: none; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .s-pause.show { display: block; }

  /* "Push me!" hint */
  .actions { margin-top: 30px; }
  .follow-wrap { position: relative; flex: 1; display: flex; }
  .follow-wrap .btn { flex: 1; }
  .hint { position: absolute; left: 50%; top: -32px; transform: translateX(-50%); background: #262626; color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 12px; white-space: nowrap; pointer-events: none; animation: bob 1s ease-in-out infinite; }
  .hint::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: #262626; }
  .hint.hide { display: none; }
  @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }
  .btn.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(0,149,246,.5); } 50% { box-shadow: 0 0 0 8px rgba(0,149,246,0); } }

  /* birthday celebration */
  .subs { margin-top: 16px; padding: 0 24px; display: flex; flex-direction: column; gap: 8px; }
  .subs div { font-size: 16px; font-weight: 700; color: #262626; background: rgba(255,255,255,.92); border-radius: 14px; padding: 8px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.12); opacity: 0; animation: subIn .5s ease forwards; }
  @keyframes subIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  .bday { position: fixed; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; opacity: 0; }
  .bday.show { animation: bdayIn 5.6s ease forwards; }
  .bday .big { font-size: 46px; font-weight: 800; line-height: 1.1; padding: 0 16px; background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 6px rgba(0,0,0,.15)); }

  @keyframes bdayIn {
    0%   { opacity: 0; transform: scale(.4); }
    8%   { opacity: 1; transform: scale(1.1); }
    13%  { transform: scale(1); }
    88%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); }

function fallback(img, i, tall) {
  img.onerror = () => {
    img.onerror = null;
    img.src = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
    img.alt = "";
    img.style.background = `linear-gradient(135deg, ${FALLBACKS[i % 6]}, ${FALLBACKS[(i + 2) % 6]})`;
    if (tall) { img.style.minHeight = "360px"; img.style.width = "100%"; }
  };
}

// header
$("uname").textContent = CONFIG.username;
$("fullname").textContent = CONFIG.fullname;
$("bio").textContent = CONFIG.bio;
$("avatar").src = CONFIG.avatar; fallback($("avatar"), 0);
$("sPosts").textContent = CONFIG.posts.length;
$("sFollowers").textContent = CONFIG.followers;
$("sFollowing").textContent = CONFIG.following;
document.title = CONFIG.username;

// follow button
let following = false;
$("followBtn").onclick = () => {
  following = !following;
  $("followBtn").textContent = following ? "Following" : "Follow";
  $("followBtn").classList.toggle("primary", !following);
  $("hint").classList.add("hide");
  $("followBtn").classList.remove("pulse");
  if (following) celebrate();
};

const LINES = [
  "Level up complete! Loading new year... 100% 🔋",
  "You're not old, you're limited edition ✨",
  "Cake calories don't count today 🍰",
  "Make a wish... then go eat the cake 🕯️",
  "Warning: extreme fabulousness detected 💅",
  "Today the whole universe is your fan club 🌟",
  "Sending virtual hugs and real cake vibes 🤗",
  "Another year of being iconic 👑",
  "Age is just a number, but you're a VIP number 💖",
  "Plot twist: you just get better every year 🎬",
  "Party mode: ON 🎈 Diet mode: OFF 🙈"
];

// confetti + birthday message
function celebrate() {
  const b = $("bday");
  const picks = LINES.slice().sort(() => Math.random() - .5).slice(0, 3);
  $("subs").innerHTML = picks.map((t, k) => `<div style="animation-delay:${0.9 + k * 0.9}s">${t}</div>`).join("");
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");

  const cv = $("confetti"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const colors = ["#feda75","#fa7e1e","#d62976","#962fbf","#4f5bd5","#0095f6","#ffffff","#ff3040"];
  const W = innerWidth, H = innerHeight;
  const pieces = Array.from({ length: 160 }, (_, k) => {
    const fromLeft = k % 2 === 0;
    return {
      x: fromLeft ? 0 : W, y: H * 0.65,
      vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 9),
      vy: -(8 + Math.random() * 12),
      size: 6 + Math.random() * 7,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
      color: colors[Math.floor(Math.random() * colors.length)],
      round: Math.random() < .3
    };
  });
  const start = performance.now();
  (function frame(t) {
    const elapsed = t - start;
    ctx.clearRect(0, 0, W, H);
    pieces.forEach(p => {
      p.vy += 0.28; p.vx *= 0.99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - elapsed / 5400);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, 6.28); ctx.fill(); }
      else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    });
    if (elapsed < 5400) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(start);
}
$("msgBtn").onclick = () => toast("Happy Birthday! 🎉");

// highlights
CONFIG.highlights.forEach(h => {
  const el = document.createElement("div");
  el.className = "hl" + (h.videos && h.videos.length ? " story" : "");
  el.innerHTML = `<div class="circle">${h.img ? `<img src="${h.img}" alt="">` : `<div>${h.emoji || "⭐"}</div>`}</div><span>${h.label}</span>`;
  el.onclick = () => (h.videos && h.videos.length) ? openStory(h) : toast(h.label);
  $("highlights").appendChild(el);
});

// grid
CONFIG.posts.forEach((p, i) => {
  const cell = document.createElement("div");
  cell.className = "cell";
  const img = document.createElement("img");
  img.src = p.img; img.alt = p.caption || ""; img.loading = "lazy";
  fallback(img, i);
  cell.appendChild(img);
  cell.onclick = () => openPost(i);
  $("grid").appendChild(cell);
});

// viewer
let current = 0, liked = {};
function openPost(i) {
  current = i;
  const p = CONFIG.posts[i];
  $("vAvatar").src = CONFIG.avatar; fallback($("vAvatar"), 0);
  $("vUser").textContent = CONFIG.username;
  $("vUser2").textContent = CONFIG.username;
  $("vImg").removeAttribute("style");
  $("vImg").src = p.img; fallback($("vImg"), i, true);
  $("vCaption").textContent = p.caption || "";
  $("vDate").textContent = p.date || "";
  $("vComments").innerHTML = (p.comments || []).map(c => `<div><b>${c.user}</b> ${c.text}</div>`).join("");
  renderLikes();
  $("viewer").classList.add("open");
  $("viewer").scrollTop = 0;
  history.pushState({ post: i }, "");
}
function renderLikes() {
  const p = CONFIG.posts[current];
  const n = (p.likes || 0) + (liked[current] ? 1 : 0);
  $("vLikes").textContent = n.toLocaleString() + " likes";
  $("likeBtn").classList.toggle("liked", !!liked[current]);
}
function closePost() { $("viewer").classList.remove("open"); }
$("backBtn").onclick = () => history.back();
window.addEventListener("popstate", closePost);

$("likeBtn").onclick = () => { liked[current] = !liked[current]; renderLikes(); };
// double-tap to like
let lastTap = 0;
$("vImgWrap").addEventListener("click", () => {
  const now = Date.now();
  if (now - lastTap < 300) {
    liked[current] = true; renderLikes();
    const h = $("heartPop"); h.classList.remove("go"); void h.offsetWidth; h.classList.add("go");
  }
  lastTap = now;
});

// ---------- story viewer (video highlights) ----------
let story = { h: null, i: 0, muted: false };
const sv = $("sVideo");

function openStory(h) {
  story.h = h; story.i = 0;
  $("sAvatar").src = CONFIG.avatar; fallback($("sAvatar"), 0);
  $("sName").textContent = h.label;
  $("sBars").innerHTML = h.videos.map(() => "<div class='s-bar'><i></i></div>").join("");
  $("story").classList.add("open");
  history.pushState({ story: true }, "");
  playStory();
}
function playStory() {
  const bars = $("sBars").querySelectorAll("i");
  bars.forEach((b, k) => b.style.width = k < story.i ? "100%" : "0");
  $("sMsg").classList.remove("show");
  $("sPause").classList.remove("show");
  sv.muted = story.muted;
  sv.src = story.h.videos[story.i];
  sv.load();
  const p = sv.play();
  if (p && p.catch) p.catch(() => {});
}
sv.addEventListener("timeupdate", () => {
  if (!sv.duration) return;
  const bar = $("sBars").querySelectorAll("i")[story.i];
  if (bar) bar.style.width = (sv.currentTime / sv.duration * 100) + "%";
});
sv.addEventListener("ended", nextStory);
sv.addEventListener("error", () => $("sMsg").classList.add("show"));
sv.addEventListener("loadeddata", () => $("sMsg").classList.remove("show"));

function nextStory() {
  if (story.i < story.h.videos.length - 1) { story.i++; playStory(); }
  else history.back();
}
function prevStory() {
  if (sv.currentTime > 2 || story.i === 0) { sv.currentTime = 0; sv.play().catch(() => {}); }
  else { story.i--; playStory(); }
}
function closeStory() {
  if (!$("story").classList.contains("open")) return;
  sv.pause(); sv.removeAttribute("src"); sv.load();
  $("story").classList.remove("open");
}
$("sNext").onclick = nextStory;
$("sPrev").onclick = prevStory;
$("sToggle").onclick = () => {
  if (sv.paused) { sv.play().catch(() => {}); $("sPause").classList.remove("show"); }
  else { sv.pause(); $("sPause").classList.add("show"); }
};
$("sClose").onclick = () => history.back();
$("sMute").onclick = () => {
  story.muted = !story.muted; sv.muted = story.muted;
  $("sMute").textContent = story.muted ? "🔇" : "🔊";
};
window.addEventListener("popstate", closeStory);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600);
}
</script>
</body>
